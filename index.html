```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Online Store</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🛍️ My Online Store</h1>
    <p>Quality products at great prices</p>
</header>

<main>

    <!-- PRODUCTS -->
    <section class="products">

        <div class="product">
            <div class="product-image">👕</div>

            <h2>T-Shirt</h2>
            <p class="price">€20.00</p>

            <button onclick="addToCart('T-Shirt', 20)">
                Add to Cart
            </button>
        </div>


        <div class="product">
            <div class="product-image">👟</div>

            <h2>Shoes</h2>
            <p class="price">€50.00</p>

            <button onclick="addToCart('Shoes', 50)">
                Add to Cart
            </button>
        </div>


        <div class="product">
            <div class="product-image">🎒</div>

            <h2>Backpack</h2>
            <p class="price">€35.00</p>

            <button onclick="addToCart('Backpack', 35)">
                Add to Cart
            </button>
        </div>


        <div class="product">
            <div class="product-image">⌚</div>

            <h2>Watch</h2>
            <p class="price">€75.00</p>

            <button onclick="addToCart('Watch', 75)">
                Add to Cart
            </button>
        </div>

    </section>


    <!-- CART -->
    <section class="cart">

        <h2>🛒 Your Cart</h2>

        <div id="cartItems">
            <p>Your cart is empty.</p>
        </div>

        <div class="cart-total">
            <strong>Total:</strong>
            €<span id="cartTotal">0.00</span>
        </div>

    </section>


    <!-- CUSTOMER DETAILS -->
    <section class="checkout">

        <h2>📦 Customer Details</h2>

        <form id="orderForm">

            <label for="customerName">
                Name
            </label>

            <input
                type="text"
                id="customerName"
                placeholder="Your name"
                required
            >


            <label for="customerPhone">
                Phone / WhatsApp
            </label>

            <input
                type="tel"
                id="customerPhone"
                placeholder="Your phone number"
                required
            >


            <label for="customerAddress">
                Delivery Address
            </label>

            <textarea
                id="customerAddress"
                placeholder="Your full delivery address"
                required
            ></textarea>


            <label for="customerCity">
                City
            </label>

            <input
                type="text"
                id="customerCity"
                placeholder="City"
                required
            >


            <label for="customerPostal">
                Postal Code
            </label>

            <input
                type="text"
                id="customerPostal"
                placeholder="Postal code"
                required
            >


            <button
                type="submit"
                class="whatsapp-button"
            >
                📱 Place Order via WhatsApp
            </button>

        </form>

    </section>

</main>


<footer>
    <p>© 2026 My Online Store</p>
</footer>


<script src="script.js"></script>

</body>
</html>
```
